[project]
name = "audio_midi_eval"
version = "0.1.0"
description = "Piano transcription CNN: HCQT-based onset/offset prediction."
requires-python = ">=3.11"
dependencies = [
    "librosa",
    "tensorflow-cpu",
    "numpy",
    "pretty_midi",
]

[project.optional-dependencies]
# training/dataset-building extras, not needed to just load a checkpoint and run inference
dev = ["jupyter", "mirdata"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
